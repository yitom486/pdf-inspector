# Fork 发行：为含 spans 补丁与 embedded outline 的 napi 构建同名 tarball，供 Inkdown 经 URL 依赖消费。
# 不改包名/版本号（避免动 version.py），上游合入后直接删本文件切回官方包。
# 手动触发。默认 dry-run（publish_release=false）：只 build/smoke/pack，
# 7 个 tgz 作为 Actions artifact 留存，不触碰 GitHub Release；
# publish_release=true 时才由 release job 创建/上传 Release，且 release_tag
# 必须精确等于本轮主包版本对应的 inkdown-napi-v<version>（防旧产物覆盖）。
# validate_release=true 则只运行 tag 校验（validate job），用于不发布的演练。
# 六平台矩阵与 musl 策略（zig + Alpine smoke）参照上游 publish.yml；
# action 引用与上游对齐 pin 到 SHA，不用浮动 tag。

name: Fork napi tarballs

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release tag for the tarballs (no default: an explicit tag is required so dry-run output can never overwrite a previous release)'
        required: true
      publish_release:
        description: 'Actually create/upload the GitHub Release (false = dry-run only)'
        required: false
        default: false
        type: boolean
      validate_release:
        description: 'Run tag validation only (no release will be created or uploaded)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build-flags: --use-napi-cross
          # aarch64 gnu 用 napi-cross 在 x64 host 上交叉编译（同上游 publish.yml）。
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build-flags: --use-napi-cross
            cflags: -D__ARM_ARCH=8
          # musl 目标经 cargo-zigbuild（napi -x）在 x64 host 上交叉编译。
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build-flags: -x
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
            build-flags: -x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # action tag "stable"; the Rust version is pinned by the toolchain input
        with:
          toolchain: '1.98.0'
          targets: ${{ matrix.target }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install zig
        if: contains(matrix.target, 'musl')
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.1

      - name: Install cargo-zigbuild
        if: contains(matrix.target, 'musl')
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild

      - name: Install napi deps
        working-directory: napi
        run: bun install

      - name: Build native addon
        working-directory: napi
        env:
          # napi-cross 的旧 AArch64 GCC 在预处理 ring 汇编时缺少该预定义宏，
          # 而 AArch64 按定义即 ARMv8（同上游 publish.yml）。
          CFLAGS_aarch64_unknown_linux_gnu: ${{ matrix.cflags }}
        run: bunx napi build --platform --release --target ${{ matrix.target }} ${{ matrix.build-flags }}

      - name: Upload native binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bindings-${{ matrix.target }}
          path: napi/*.node
          if-no-files-found: error
          retention-days: 7

      - name: Upload generated JS bindings
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: js-bindings
          path: |
            napi/index.js
            napi/index.d.ts
          if-no-files-found: error
          retention-days: 7

  smoke-test:
    name: Smoke test ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download native binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bindings-${{ matrix.target }}
          path: napi

      - name: Download generated JS bindings
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: js-bindings
          path: napi

      # musl 产物必须在真实 musl libc 下加载，故进 Alpine 跑。
      - name: Run smoke test (Alpine)
        if: contains(matrix.target, 'musl')
        run: docker run --rm -v "$PWD:/repo" -w /repo/napi node:24-alpine node test.mjs && docker run --rm -v "$PWD:/repo" -w /repo/napi node:24-alpine node test-outline.mjs

      - name: Run smoke test
        if: ${{ !contains(matrix.target, 'musl') }}
        working-directory: napi
        run: node test.mjs && node test-outline.mjs

  pack:
    name: Pack tarballs
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Pack platform + main tarballs
        working-directory: napi
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist-tgz
          for node_file in ../artifacts/bindings-*/pdf-inspector.*.node; do
            base=$(basename "$node_file")
            suffix=${base#pdf-inspector.}
            suffix=${suffix%.node}
            pkg="@firecrawl/pdf-inspector-$suffix"
            dir="npm-dist/$suffix"
            mkdir -p "$dir"
            cp "$node_file" "$dir/"
            node -e '
              const [suffix, version] = process.argv.slice(1)
              const meta = {
                "linux-x64-gnu":    { os: ["linux"],  cpu: ["x64"],   libc: ["glibc"] },
                "linux-x64-musl":   { os: ["linux"],  cpu: ["x64"],   libc: ["musl"] },
                "linux-arm64-gnu":  { os: ["linux"],  cpu: ["arm64"], libc: ["glibc"] },
                "linux-arm64-musl": { os: ["linux"],  cpu: ["arm64"], libc: ["musl"] },
                "darwin-arm64":     { os: ["darwin"], cpu: ["arm64"] },
                "win32-x64-msvc":   { os: ["win32"],  cpu: ["x64"] },
              }[suffix]
              if (!meta) {
                console.error(`unknown platform suffix: ${suffix}`)
                process.exit(1)
              }
              const pkg = {
                name: `@firecrawl/pdf-inspector-${suffix}`,
                version,
                description: `Prebuilt ${suffix} binary for @firecrawl/pdf-inspector (fork with OCR spans + embedded outline)`,
                main: `pdf-inspector.${suffix}.node`,
                files: [`pdf-inspector.${suffix}.node`],
                license: "MIT",
                engines: { node: ">= 10" },
                ...meta,
              }
              require("fs").writeFileSync(`npm-dist/${suffix}/package.json`, JSON.stringify(pkg, null, 2) + "\n")
            ' "$suffix" "$VERSION"
            (cd "$dir" && npm pack --pack-destination ../../dist-tgz/)
          done
          cp ../artifacts/js-bindings/index.js ../artifacts/js-bindings/index.d.ts .
          npm pack --pack-destination dist-tgz/
          ls -la dist-tgz/

      # dry-run 交付物：6 平台包 + 主包共 7 个 tgz，仅作 artifact 留存。
      - name: Upload tarballs (dry-run artifact)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fork-tarballs
          path: napi/dist-tgz/*.tgz
          if-no-files-found: error
          retention-days: 7

  validate:
    name: Validate release tag
    needs: pack
    if: inputs.validate_release == true || inputs.publish_release == true
    runs-on: ubuntu-latest
    steps:
      - name: Download smoke-passed tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fork-tarballs
          path: dist-tgz

      # Overwrite guard: the tag must exactly match the main tarball packed
      # in THIS run (already smoke-passed). Anything else fails here, and
      # this job never runs any gh release command.
      # Main-tarball selection uses a case allowlist so no pattern is ever
      # parsed as a command option.
      - name: Validate release tag against packed version
        shell: bash
        run: |
          main_tgz=""
          count=0
          for f in dist-tgz/*.tgz; do
            case "$f" in
              *-linux-*|*-darwin-*|*-win32-*) continue ;;
            esac
            if [ -z "$main_tgz" ]; then
              main_tgz="$f"
            fi
            count=$((count + 1))
          done
          if [ "$count" != "1" ]; then
            echo "expected exactly one main tarball in dist-tgz, found $count:"
            ls -la dist-tgz/
            exit 1
          fi
          tmpdir=$(mktemp -d)
          tar -xzf "$main_tgz" -C "$tmpdir"
          VERSION=$(node -p "require('$tmpdir/package/package.json').version")
          EXPECTED="inkdown-napi-v$VERSION"
          if [ "$RELEASE_TAG" != "$EXPECTED" ]; then
            echo "Refusing to publish: release_tag ($RELEASE_TAG) != $EXPECTED derived from this run's packed main tarball ($VERSION)."
            exit 1
          fi
          echo "Release tag OK: $RELEASE_TAG matches packed version $VERSION."
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}

  release:
    name: Publish tarballs to Release
    needs: [pack, validate]
    if: inputs.publish_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download smoke-passed tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fork-tarballs
          path: dist-tgz

      - name: Create Release if missing
        run: gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes "Fork napi builds with positioned OCR spans and embedded outline (see firecrawl/pdf-inspector#514)."
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload tarballs
        run: gh release upload "$RELEASE_TAG" dist-tgz/*.tgz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
