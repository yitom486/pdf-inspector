# Fork 发行：为含 spans 补丁的 napi 构建同名 tarball，供 Inkdown 经 URL 依赖消费。
# 不改包名/版本号（避免动 version.py），上游合入后直接删本文件切回官方包。
# 手动触发，产物附到指定 Release tag。

name: Fork napi tarballs

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release tag for the tarballs'
        required: true
        default: inkdown-napi-v1.18.0

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_napi_cross: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
          targets: ${{ matrix.target }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install napi deps
        working-directory: napi
        run: bun install

      - name: Build native addon
        working-directory: napi
        run: bunx napi build --platform --release --target ${{ matrix.target }} ${{ matrix.use_napi_cross && '--use-napi-cross' || '' }}

      - name: Upload native binary
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: napi/*.node
          if-no-files-found: error
          retention-days: 7

      - name: Upload generated JS bindings
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v4
        with:
          name: js-bindings
          path: |
            napi/index.js
            napi/index.d.ts
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Pack tarballs to Release
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Pack platform + main tarballs
        working-directory: napi
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist-tgz
          for node_file in ../artifacts/bindings-*/pdf-inspector.*.node; do
            base=$(basename "$node_file")
            suffix=${base#pdf-inspector.}
            suffix=${suffix%.node}
            pkg="@firecrawl/pdf-inspector-$suffix"
            dir="npm-dist/$suffix"
            mkdir -p "$dir"
            cp "$node_file" "$dir/"
            node -e '
              const [suffix, version] = process.argv.slice(1)
              const meta = {
                "linux-x64-gnu":    { os: ["linux"],  cpu: ["x64"],   libc: ["glibc"] },
                "darwin-arm64":     { os: ["darwin"], cpu: ["arm64"] },
                "win32-x64-msvc":   { os: ["win32"],  cpu: ["x64"] },
              }[suffix]
              if (!meta) {
                console.error(`unknown platform suffix: ${suffix}`)
                process.exit(1)
              }
              const pkg = {
                name: `@firecrawl/pdf-inspector-${suffix}`,
                version,
                description: `Prebuilt ${suffix} binary for @firecrawl/pdf-inspector (fork with OCR spans)`,
                main: `pdf-inspector.${suffix}.node`,
                files: [`pdf-inspector.${suffix}.node`],
                license: "MIT",
                engines: { node: ">= 10" },
                ...meta,
              }
              require("fs").writeFileSync(`npm-dist/${suffix}/package.json`, JSON.stringify(pkg, null, 2) + "\n")
            ' "$suffix" "$VERSION"
            (cd "$dir" && npm pack --pack-destination ../../dist-tgz/)
          done
          cp ../artifacts/js-bindings/index.js ../artifacts/js-bindings/index.d.ts .
          npm pack --pack-destination dist-tgz/
          ls -la dist-tgz/

      - name: Create Release if missing
        run: gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes "Fork napi builds with positioned OCR spans (see firecrawl/pdf-inspector#514)."
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload tarballs
        run: gh release upload "$RELEASE_TAG" napi/dist-tgz/*.tgz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
